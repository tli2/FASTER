apiVersion: batch/v1
kind: Job
metadata:
  name: client
spec:
  template:
    spec:
      # UPDATED: Uses the defined ServiceAccount
      serviceAccountName: dse-runner
      initContainers:
        - name: wait-all
          image: {{ .Values.kubectl_image }}
          command: [ "sh", "-c" ]
          args:
            - >
              while true; do
                # Check if all deployments have at least one ready replica
                notReadyCount=$(kubectl get deployments -n dse | grep -c "0/1")
                if [ "$notReadyCount" -eq 0 ]; then
                  echo "All deployments are ready.";
                  break;
                else
                  echo "Waiting for all deployments to be ready. $notReadyCount deployments are not ready.";
                  sleep 1;
                fi;
              done;
      containers:
        - name: client
          image: {{ .Values.image }}
          # ADDED: workingDir so the command finds the file
          workingDir: "/app/TwoPhaseCommitOrleans"
          command:
            - "./TwoPhaseCommitOrleans"
          args:
            - "-t"
            - "client"
            - "-w"
            - "{{ $.Values.window }}"
            - "-n"
            - '{{ $.Values.num_silos}}'
            - "-o"
            - "2pc-orleans-results-{{.Values.tag}}.txt"
          ports:
            - containerPort: 15721
          env:
            - name: AZURE_TABLE_CONN_STRING
              value: "{{ $.Values.azure_table_conn_string }}"
            - name: AZURE_RESULTS_CONN_STRING
              value: "{{ $.Values.results_conn_string }}"
      restartPolicy: Never