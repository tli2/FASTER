apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    service: dprfinder
  name: dprfinder
spec:
  replicas: 1
  selector:
    matchLabels:
      service: dprfinder
  strategy: {}
  template:
    metadata:
      labels:
        service: dprfinder
    spec:
      containers:
        - command:
            - "./TravelReservation"
          args: 
            - "-t"
            - "dprfinder"
          image: {{ .Values.image }}
          workingDir: "/app/TravelReservation/"
          name: dprfinder
          ports:
            - containerPort: 15721
            - containerPort: 4022
          readinessProbe:
            tcpSocket:
              port: 15721
            initialDelaySeconds: 5
            periodSeconds: 2
          volumeMounts:
            - name: dprfinderstorage
              mountPath: "/mnt/plrs"
          envFrom:
            - configMapRef:
                name: env-config
      volumes:
        - name: dprfinderstorage
          persistentVolumeClaim:
            claimName: dprfinder-pvc
      nodeSelector:
        nodepool: dsebench
      restartPolicy: Always