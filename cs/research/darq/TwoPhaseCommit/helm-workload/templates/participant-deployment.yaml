{{- range .Values.participants }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    type: participant
    service: participant{{ .num }}
  name: participant{{ .num }}
spec:
  replicas: 1
  selector:
    matchLabels:
      service: participant{{ .num }}
  strategy: {}
  template:
    metadata:
      labels:
        type: participant
        service: participant{{ .num }}
    spec:
      serviceAccountName: deployment-watcher
      initContainers:
        - name: wait-for-dprfinder{{ .num }}
          image: bitnami/kubectl
          imagePullPolicy: IfNotPresent
          command: [ 'sh', '-c', 'until kubectl get deployment -l service=dprfinder -n dse | grep -q "1/1"; do echo waiting for deployment-b; sleep 1; done;' ]
      containers:
        - command:
            - "./TwoPhaseCommit"
          args:
            - "-t"
            - "participant"
            - "-n"
            - "{{ .num }}"
            {{- if $.Values.failover }}
            - "-f"
            {{- end }}
          workingDir: "/app/TwoPhaseCommit"
          image: tianyuli96/faster:latest
          name: participant{{ .num }}
          ports:
            - containerPort: 15721
          volumeMounts:
            - name: participant{{ .num }}storage
              mountPath: "/mnt/plrs"
          envFrom:
            - configMapRef:
                name: env-config
      volumes:
        - name: participant{{ .num }}storage
          persistentVolumeClaim:
            claimName: participant{{ .num }}-pvc
      nodeSelector:
        nodepool: dsebench
      restartPolicy: Always
---
{{- end }}