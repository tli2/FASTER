syntax = "proto3";
option csharp_namespace = "protobuf";

message OrderLine {
  int32 item_id = 1;
  int32 w_id = 2;
  int32 quantity = 3;
}

message NewOrderRequest {
  int32 w_id = 1;
  int32 d_id = 2;
  int32 c_id = 3;
  repeated OrderLine items = 4;
}

message NewOrderResponse {
  bool success = 1;
}

message PaymentRequest {
  int32 w_id = 1;
  int32 d_id = 2;
  int32 c_id = 3;
  int32 cw_id = 4;
  int32 cd_id = 5;
  float amount = 6;
}

message PaymentResponse {
  bool success = 1;
}

message OrderStatusRequest {
  int32 w_id = 1;
  int32 d_id = 2;
  int32 c_id = 3;
}

message OrderStatusResponse {
  bool success = 1;
  int32 c_id = 2;
  int32 o_id = 3;
  int32 w_id = 4;
  repeated OrderLine orderLines = 5;
}

message DeliveryRequest {
  int32 w_id = 1;
  int32 carrier_id = 2;
}

message DeliveryResponse {
  bool success = 1;
}

message StockLevelRequest {
  int32 w_id = 1;
  int32 d_id = 2;
  int32 threshold = 3;
}

message StockLevelResponse {
  int32 belowCount = 1;
}

service TpccShardService {
  rpc NewOrder(NewOrderRequest) returns (NewOrderResponse);
  
  rpc Payment(PaymentRequest) returns (PaymentResponse);

  rpc OrderStatus(OrderStatusRequest) returns (OrderStatusResponse);
  
  rpc Delivery(DeliveryRequest) returns (DeliveryResponse);
  
  rpc StockLevel(StockLevelRequest) returns (StockLevelResponse);
}
